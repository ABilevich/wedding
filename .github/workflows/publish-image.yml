name: Publicar imagen Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wedding-publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Definir nombre de la imagen
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construir imagen de prueba
        run: docker buildx build --pull --load --platform linux/amd64 --tag wedding-smoke:local .

      - name: Comprobar Nginx y todos los archivos de la web
        run: |
          set -euo pipefail
          docker run --rm wedding-smoke:local nginx -t
          docker run -d --name wedding-smoke -p 127.0.0.1:8080:8080 wedding-smoke:local
          trap 'docker logs wedding-smoke; docker rm -f wedding-smoke' EXIT
          # Docker can accept a connection before Nginx is ready, then reset it (curl 56).
          # Retry startup errors with a time limit; fail the job if readiness never succeeds.
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            --connect-timeout 2 --max-time 3 --retry-max-time 60 \
            http://127.0.0.1:8080/healthz
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import quote
          from urllib.error import HTTPError

          base = 'http://127.0.0.1:8080/'
          site = Path('site')
          paths = sorted(p for p in site.rglob('*') if p.is_file())
          for path in paths:
              url = base + quote(path.relative_to(site).as_posix())
              with urlopen(url, timeout=10) as response:
                  assert response.read() == path.read_bytes(), f'Incorrect content: {path}'
                  if path.suffix == '.css':
                      assert response.headers.get_content_type() == 'text/css'
                  if path.suffix == '.js':
                      assert response.headers.get_content_type() in ('application/javascript', 'text/javascript')
          with urlopen(base, timeout=10) as response:
              assert response.read() == (site / 'index.html').read_bytes()
              assert response.headers.get('Cache-Control') == 'no-cache'
          try:
              urlopen(base + 'missing-file-check.png', timeout=10)
          except HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError('Missing assets must return 404')
          print(f'OK: homepage and {len(paths)} files served correctly')
          PY

      - name: Iniciar sesión en GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # COPY-only Dockerfile: no emulation is needed to build ARM64 from AMD64.
      - name: Publicar para servidores AMD64 y ARM64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.title=Natasha & Andres - Save the Date" \
            --metadata-file /tmp/wedding-image-metadata.json \
            --push .

      - name: Mostrar comando para levantar la web
        run: |
          DIGEST=$(python3 -c 'import json; print(json.load(open("/tmp/wedding-image-metadata.json"))["containerimage.digest"])')
          {
            echo '## Imagen publicada'
            echo
            echo "Imagen: \`$IMAGE:latest\`"
            echo "Versión: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "Referencia exacta: \`$IMAGE@$DIGEST\`"
            echo
            echo '```sh'
            echo "docker run -d --name wedding --restart unless-stopped -p 8080:8080 $IMAGE@$DIGEST"
            echo '```'
            echo
            echo 'Abrir http://localhost:8080. Si el paquete es privado, ejecutar primero docker login ghcr.io.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cerrar sesión en el registro
        if: always()
        run: docker logout ghcr.io
